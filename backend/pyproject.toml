[project]
name = "vayunx-backend"
version = "0.1.0"
description = "VAYUNX Chat Application backend (Grade A)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "websockets>=13.0",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "liboqs-python>=0.10.0",
    "pyotp>=2.9",
    "authlib>=1.3",
    "pysaml2>=7.5",
    # pysaml2 declares pyopenssl<24.3, but that's incompatible with the
    # cryptography>=43.0 already required above (used for Ed25519/AES-256-GCM —
    # see crypto/providers/). A newer pyOpenSSL works fine against it at
    # runtime despite pysaml2's own (outdated) upper bound; pinning explicitly
    # here so a fresh install doesn't silently resolve to the broken pairing.
    "pyopenssl>=24",
    # XML signature verification for pysaml2 — not pulled in automatically on
    # all platforms. A prebuilt wheel exists for Windows/most Linux/macOS, no
    # system libxmlsec1 compile needed.
    "xmlsec>=1.3.13",
    "arq>=0.26",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# liboqs-python ships no type stubs / py.typed marker upstream.
module = "oqs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore ship no inline type stubs (py.typed) upstream either.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pysaml2 ships no inline type stubs (py.typed) upstream either.
module = "saml2.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
