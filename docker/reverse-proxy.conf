# TLS termination for VAYUNX (Grade A).
#
# Requires an nginx/OpenSSL build with post-quantum hybrid key-exchange support
# (OpenSSL 3.2+ built against the Open Quantum Safe `oqs-provider`, or an
# equivalent BoringSSL/liboqs-enabled build). Stock nginx images do NOT ship
# with ML-KEM-768 support out of the box — see DECISIONS.md for the exact
# base image / provider configuration used to build the `reverse-proxy` image.
# `X25519MLKEM768` is the IANA-registered hybrid group name (classical X25519
# + ML-KEM-768) satisfying FR-047's "hybrid X25519+ML-KEM-768" requirement.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:80;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.3 only, per FR-047 / Constitution constraints.
        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768:X25519:secp384r1;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}
