services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vayunx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-vayunx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 (not 5432) to avoid colliding with a native PostgreSQL
      # that may bind 127.0.0.1:5432. The app's DATABASE_URL points at :5433.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayunx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mailhog — local SMTP capture + web inbox for dev. The backend's
  # `send_verification_email` job delivers here instead of logging the link.
  # Host dev: SMTP_HOST=localhost:1025 (port published below); web inbox on :8025.
  # Full-docker stack: the worker service overrides SMTP_HOST=mailhog below.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI (http://localhost:8025)

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    command: ["arq", "src.workers.worker_settings.WorkerSettings"]
    env_file:
      - ../.env
    environment:
      # Inside the docker network, the Mailhog container is reachable by name,
      # not `localhost` (which the host-oriented .env sets). This override only
      # affects the in-docker worker; host-dev still uses SMTP_HOST from .env.
      SMTP_HOST: mailhog
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    expose:
      - "80"

  reverse-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./reverse-proxy.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:-./certs/server.crt}:/etc/nginx/certs/server.crt:ro
      - ${TLS_KEY_PATH:-./certs/server.key}:/etc/nginx/certs/server.key:ro
    ports:
      - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
